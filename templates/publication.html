<article class="$classes" aria-labelledby="$id-title">
  $media
  <div class="publication-copy">
    <h3 id="$id-title"><a href="$title_url">$title</a></h3>
    <p class="publication-authors">$authors</p>
    <p class="publication-venue">$venue</p>
    <ul class="publication-links" aria-label="$name resources">
      $links
    </ul>
  </div>
</article>
